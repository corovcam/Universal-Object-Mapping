# pydoc-markdown.yaml
loaders:
  - type: python
    search_path: ["./src"]          # <- classic src/ layout
    packages: ["react_agent", "server", "uom_acp", "uom_deep_agent"]
    # modules: ["react_agent.graph", "server.main", "uom_acp.main", "uom_deep_agent.uom_agent"]

processors:
  - type: smart
  - type: filter
    documented_only: true    # include objects without docstrings
    skip_empty_modules: false  # keep modules even if they have no content
  - type: crossref

renderer:
  type: pydoc_mintlify.MintlifyRenderer
  docs_base_path: ../../external/uom-docs
  relative_output_path: backend_code_reference
  nav: # Navigation configuration for your generated .mdx files. (This will be dumped into a tab with the same name in your docs.json)
    tab: Backend Code Reference # Must match the name of a tab in your docs.json
    directory: accordion
    groups:
      - group: UOM Translator (LangGraph)
        root: react_agent/index
        pages:
          - react_agent/graph
          - react_agent/state
          - react_agent/context
          - react_agent/prompts
          - react_agent/tools
          - react_agent/constants
          - group: Custom Tools
            pages:
              - react_agent/custom_tools/docs_search
              - react_agent/custom_tools/dotnet_validator
              - react_agent/custom_tools/java_validator
              - react_agent/custom_tools/mcp_database
              - react_agent/custom_tools/query_validator
              - react_agent/custom_tools/sandbox_tools
          - group: Utils
            root: react_agent/utils/index
            pages:
              - react_agent/utils/deterministic_checks
              - react_agent/utils/preprocessing
              - react_agent/utils/request_logging
              - react_agent/utils/sandboxes
              - react_agent/utils/types
              - react_agent/utils/utils
      - group: UOM Deep Agent (UOM Assistant)
        pages:
          - title: UOM Deep Agent
            description: The main entrypoint for the UOM Deep Agent (UOM Assistant), which provides general-purpose agent capabilities, including invoking UOM Translator as an `AsyncSubagent` and having complete access to local/sandbox shell and file system.
            path: uom_deep_agent/uom_agent
          - uom_deep_agent/local_context
      - group: UOM ACP (Agent Client Protocol)
        pages:
          - title: UOM ACP Server
            description: Entrypoint for the UOM ACP ([Agent Client Protocol](https://agentclientprotocol.com/get-started/introduction)) server, which provides a standardized interface for agents to interact with code editors/IDEs, and is used as the main interface for the UOM Deep Agent.
            path: uom_acp/main
